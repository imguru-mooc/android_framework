<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 2 Worksheet — Android Framework 16 심화</title><style>
:root{--ink:#1C242C;--ink2:#4A5560;--line:#DCE1E6;--panel:#F3F5F7;--green:#1F7A4D;--green2:#E3F3EA;--red:#B42318;--red2:#FDECEC}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,"Segoe UI",sans-serif;line-height:1.65}
.wrap{max-width:840px;margin:0 auto;padding:36px 32px 90px}
.meta{display:flex;gap:18px;align-items:baseline;color:var(--ink2);font-size:.9rem;border-bottom:2px solid var(--green);padding-bottom:10px}
.meta b{color:var(--green);font-size:1rem}
h1{font-size:1.7rem;margin:.5em 0 .2em}
h2{font-size:1.1rem;margin:2em 0 .8em;padding-left:10px;border-left:4px solid var(--green)}
.lead{color:var(--ink2);margin:0 0 6px}
.name{margin:18px 0 6px;display:flex;gap:10px;align-items:center;font-size:.95rem}
.name input{border:0;border-bottom:1px solid var(--ink);width:180px;font-size:1rem;padding:4px;outline:none;font-family:inherit}
.q{border:1px solid var(--line);border-radius:10px;padding:16px 18px 12px;margin:0 0 14px;background:#fff}
.q .t{font-weight:600;margin-bottom:10px}
.q .t span{color:var(--green);margin-right:8px}
.q .t small{font-weight:400;color:var(--ink2);margin-left:8px;font-size:.8rem}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--panel)}
.opt input{margin-top:4px;accent-color:var(--green)}
.opt .k{color:var(--ink2);width:1.2em;flex:none}
.q.ok{border-color:var(--green)} .q.ng{border-color:var(--red)}
.opt.correct{background:var(--green2);border-color:var(--green)}
.opt.wrong{background:var(--red2);border-color:var(--red)}
input.txt{font:inherit;font-size:.95rem;padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:100%;max-width:420px;outline:none}
input.txt:focus{border-color:var(--green)}
input.txt.ok{border-color:var(--green);background:var(--green2)} input.txt.ng{border-color:var(--red);background:var(--red2)}
.fb input.txt{display:inline-block;width:200px;margin:4px 10px 4px 0}
.fb .lbl{color:var(--ink2);font-size:.9rem;margin-right:4px}
.ord .row,.match .row{display:flex;gap:12px;align-items:center;padding:6px 4px}
select{font:inherit;font-size:.92rem;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
select.ok{border-color:var(--green);background:var(--green2)} select.ng{border-color:var(--red);background:var(--red2)}
.match .row .l{min-width:140px;font-weight:600}
.match .row .arrow{color:var(--ink2)}
.exp{display:none;margin-top:10px;padding:10px 12px;background:var(--panel);border-left:3px solid var(--green);border-radius:0 6px 6px 0;font-size:.92rem;white-space:pre-line}
.exp.show{display:block}
.exp b{color:var(--green)}
code{font-family:'Cascadia Code',Consolas,monospace;font-size:.88em;background:#F0F2F5;padding:1px 5px;border-radius:4px}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
button{white-space:nowrap;background:var(--green);color:#fff;border:0;padding:9px 16px;border-radius:6px;font-size:.92rem;cursor:pointer;font-family:inherit}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
#score{margin-left:auto;font-weight:600;font-size:1rem}
#score.good{color:var(--green)} #score.bad{color:var(--red)}
.hint{font-size:.82rem;color:var(--ink2)}
@media print{.bar,.hint{display:none}.q{break-inside:avoid}.exp{display:none!important}input.txt,select{border:0;border-bottom:1px solid #999;border-radius:0;background:none!important}.opt.correct,.opt.wrong{background:none;border-color:transparent}.q.ok,.q.ng{border-color:var(--line)} body.printkey .exp{display:block!important} body.printkey .opt.correct{background:var(--green2)}}
</style></head><body>
<div class="wrap">
<div class="meta"><b>Worksheet</b><span>소요시간 25분</span><span>Android Framework 16 심화 · Day 2</span></div>
<h1>Day 2 Worksheet</h1>
<p class="lead">객관식 8 · 단답형 5 · 빈칸 채우기 4 · 순번 지정 2 · 선잇기 1 — 총 20문제</p>
<div class="name">이름 <input type="text" placeholder="            "></div>
<div id="qs"></div>
<div class="bar">
  <button id="btnGrade">채점하기</button>
  <button id="btnKey" class="ghost">정답·해설 모두 보기</button>
  <button id="btnReset" class="ghost">다시 풀기</button>
  <button id="btnPrint" class="ghost">인쇄 (문제만)</button>
  <button id="btnPrintKey" class="ghost">인쇄 (정답 포함)</button>
  <span id="score"></span>
</div>
<p class="hint">단답형·빈칸은 대소문자와 공백을 무시하고 채점합니다. 순번은 1부터 번호를 고르고, 선잇기는 오른쪽 목록에서 알맞은 역할을 선택하세요.</p>
</div>
<script>
const QS=[{"t": "mc", "q": "Native Binder 에서 Process 당 하나만 존재하며 <code>/dev/binder</code> 를 열고 1 MB 를 mmap 하는 클래스는?", "opts": ["IPCThreadState", "ProcessState", "BBinder", "IServiceManager"], "a": 1, "exp": "ProcessState::self() 가 /dev/binder open, mmap, Thread Pool 관리를 담당한다. IPCThreadState 는 Thread 마다 하나로 transact/joinThreadPool 을 맡는다."}, {"t": "mc", "q": "Server 측에서 요청을 받아 code 로 분기하는 <code>onTransact()</code> 를 가진 기본 클래스는?", "opts": ["BpBinder", "BBinder", "BpInterface", "IInterface"], "a": 1, "exp": "BBinder 가 로컬 Binder 객체의 기본 클래스이며 onTransact 를 오버라이드해 요청을 처리한다. BpBinder 는 원격 handle 을 감싼 Proxy 다."}, {"t": "mc", "q": "<code>interface_cast&lt;ILedService&gt;(binder)</code> 가 내부적으로 호출하는 것은?", "opts": ["ILedService::asInterface(binder)", "new BnLedService(binder)", "binder->transact(0)", "defaultServiceManager()->getService()"], "a": 0, "exp": "interface_cast 는 I::asInterface() 를 호출한다. asInterface 는 queryLocalInterface 로 로컬이면 객체 자체를, 원격이면 new BpX(binder) 를 반환한다."}, {"t": "mc", "q": "AIDL Method 의 첫 번째 Transaction code 값(<code>FIRST_CALL_TRANSACTION</code>)은?", "opts": ["0", "1", "0x5f444d50", "100"], "a": 1, "exp": "IBinder::FIRST_CALL_TRANSACTION = 1 이다. 0x5f444d50 은 DUMP_TRANSACTION 등 예약된 특수 code 의 형태다."}, {"t": "mc", "q": "Callback 처럼 IBinder 를 Parcel 에 실어 보낼 때 Proxy 가 사용하는 Parcel API 는?", "opts": ["writeInt32", "writeString16", "writeStrongBinder", "writeFileDescriptor"], "a": 2, "exp": "writeStrongBinder 로 실린 IBinder 는 Driver 를 지나며 송신 측 포인터가 수신 측 handle 로 변환된다."}, {"t": "mc", "q": "vendor 파티션의 AIDL HAL 프로세스가 링크할 수 있는 Binder 라이브러리는?", "opts": ["libbinder", "libbinder_ndk", "libhwbinder", "libutils"], "a": 1, "exp": "vendor 는 system 전용 libbinder 를 쓸 수 없고 안정 ABI 인 libbinder_ndk(NDK backend) 만 사용한다."}, {"t": "mc", "q": "SELinux 가 permissive 인 상태에서 정책 위반이 발생하면?", "opts": ["즉시 차단되고 프로세스가 종료된다", "avc: denied 로그만 남고 동작은 허용된다", "아무 로그 없이 허용된다", "커널 패닉이 발생한다"], "a": 1, "exp": "permissive 는 기록만 하고 허용한다(로그에 permissive=1). enforcing 으로 바꾸면 같은 위반이 실제로 차단된다."}, {"t": "mc", "q": "init.rc 의 <code>service</code> 로 등록한 데몬을 시작하는 명령은?", "opts": ["systemctl start <name>", "start <name>", "adb shell run <name>", "exec /system/bin/<name>"], "a": 1, "exp": "start <name> (= setprop ctl.start <name>) 으로 init 에게 요청한다. 상태는 getprop init.svc.<name> 으로 확인한다."}, {"t": "sa", "q": "Native Binder Server 의 main() 마지막 줄에서 현재 Thread 를 요청 대기 루프로 만드는 <code>IPCThreadState</code> 의 Method 이름은?", "a": ["jointhreadpool", "jointhreadpool()", "ipcthreadstate::self()->jointhreadpool()"], "show": "joinThreadPool()", "exp": "IPCThreadState::self()->joinThreadPool() 은 반환하지 않고 Binder 요청을 처리한다. startThreadPool() 은 추가 Thread 를 만드는 것으로 별개다."}, {"t": "sa", "q": "Stub Method 안에서 호출자의 UID 를 얻는 <code>IPCThreadState</code> 의 Method 이름은?", "a": ["getcallinguid", "getcallinguid()", "ipcthreadstate::self()->getcallinguid()"], "show": "getCallingUid()", "exp": "Driver 가 Transaction 에 붙인 sender_euid 를 반환한다. 커널 cred 기반이라 사용자 공간에서 위조할 수 없다."}, {"t": "sa", "q": "system_server 와 system 계정이 사용하는 UID 값(<code>AID_SYSTEM</code>)은?", "a": ["1000"], "show": "1000", "exp": "AID_SYSTEM = 1000. root 는 0, 일반 App 은 10000 번대(AID_APP_START) 부터 하나씩 받는다."}, {"t": "sa", "q": "Soong 에서 <code>.aidl</code> 파일로 cpp/ndk/java backend 라이브러리를 생성하는 모듈 타입 이름은?", "a": ["aidl_interface"], "show": "aidl_interface", "exp": "aidl_interface { name, srcs, backend { cpp/ndk/java } } 가 <name>-cpp, <name>-ndk 라이브러리를 만든다."}, {"t": "sa", "q": "Binder Service 이름과 handle 을 관리하며 <code>addService</code> 시 SELinux 검사(<code>canAdd</code>)를 수행하는 Native 데몬의 이름은?", "a": ["servicemanager", "servicemanager", "service_manager"], "show": "servicemanager", "exp": "frameworks/native/cmds/servicemanager. Java 의 ServiceManager.addService 와 C++ 의 defaultServiceManager()->addService 모두 여기(handle 0)에 도착한다."}, {"t": "fb", "q": "수작업 인터페이스에서 헤더의 <b>[1]</b> 매크로가 asInterface/descriptor 를 선언하고, .cpp 의 <b>[2]</b> 매크로가 그 본문과 descriptor 문자열을 정의한다.", "a": [["declare_meta_interface"], ["implement_meta_interface"]], "show": ["DECLARE_META_INTERFACE", "IMPLEMENT_META_INTERFACE"], "exp": "DECLARE_META_INTERFACE(X) 는 선언, IMPLEMENT_META_INTERFACE(X, \"desc\") 는 구현. AIDL 은 이 쌍을 자동 생성한다."}, {"t": "fb", "q": "Proxy 는 Parcel 맨 앞에 <b>[1]</b> 로 인터페이스 토큰을 쓰고, Stub 은 <b>[2]</b> 매크로로 그 토큰을 검증한 뒤 인자를 읽는다.", "a": [["writeinterfacetoken", "writeinterfacetoken()", "data.writeinterfacetoken"], ["check_interface", "check_interface()"]], "show": ["writeInterfaceToken", "CHECK_INTERFACE"], "exp": "토큰이 없거나 다르면 CHECK_INTERFACE 가 PERMISSION_DENIED 를 반환한다. service call 에 s16 \"descriptor\" 를 붙여야 하는 이유다."}, {"t": "fb", "q": "AIDL cpp backend 가 생성한 Method 는 예외를 <b>[1]</b> 타입으로 반환하고, 반환값은 <b>[2]</b> 이름의 out 포인터 인자로 전달한다.", "a": [["binder::status", "status", "android::binder::status"], ["_aidl_return", "*_aidl_return", "aidl_return"]], "show": ["binder::Status", "_aidl_return"], "exp": "Status f(in…, T* _aidl_return). Status::fromExceptionCode(EX_SECURITY) 등이 Parcel 예외 헤더로 전달되어 Java 예외가 된다."}, {"t": "fb", "q": "AIDL HAL 인스턴스 이름은 <b>[1]</b>.<b>[2]</b>/default 형식이다. 예: android.hardware.light.ILights/default 에서 [1]=android.hardware.light, [2]=ILights.", "a": [["패키지", "package", "패키지명", "<pkg>", "pkg"], ["인터페이스", "interface", "인터페이스명", "<interface>"]], "show": ["패키지", "인터페이스"], "exp": "<패키지>.<인터페이스>/<인스턴스>. vendor manifest 의 <fqname>ILights/default</fqname> 와 대응한다."}, {"t": "ord", "q": "Client 의 <code>led->ledOn(70)</code> 호출이 처리되는 순서대로 번호를 매기시오.", "items": ["BnLedService::onTransact 가 readInt32 로 인자를 읽고 ledOn() 호출", "BpLedService::ledOn 이 Parcel 에 토큰과 70 을 쓰고 transact()", "Driver 가 서버의 Binder Thread 를 깨운다", "Proxy 가 reply.readInt32() 로 반환값을 돌려준다", "IPCThreadState::transact 가 ioctl(BINDER_WRITE_READ) 호출"], "a": [4, 1, 3, 5, 2], "exp": "Proxy 직렬화 → IPCThreadState ioctl → Driver 가 Binder Thread 깨움 → Stub 역직렬화·호출 → reply 로 반환."}, {"t": "ord", "q": "init.rc 로 등록한 데몬이 <code>start</code> 명령으로 실행되어 Service 를 등록하기까지의 순서를 매기시오.", "items": ["servicemanager 가 SELinux canAdd 검사 후 테이블에 등록", "init 이 .rc 정의를 찾아 fork → setuid(user) → exec", "데몬이 defaultServiceManager()->addService() 호출", "start <name> (setprop ctl.start) 실행", "exec 시 SELinux 도메인 전환 (전용 .te 없으면 init 도메인 유지)"], "a": [5, 2, 4, 1, 3], "exp": "start → init fork/exec → 도메인 전환 → addService → servicemanager canAdd 검사·등록."}, {"t": "match", "q": "C++ Native Binder 클래스와 Day 1 Java 클래스를 알맞게 연결하시오.", "left": ["BBinder", "BpBinder", "BnInterface&lt;I&gt;", "BpInterface&lt;I&gt;", "interface_cast&lt;I&gt;"], "right": ["Stub.Proxy", "I.Stub.asInterface()", "Binder", "BinderProxy", "I.Stub"], "a": [2, 3, 4, 0, 1], "exp": "BBinder↔Binder, BpBinder↔BinderProxy, BnInterface↔Stub, BpInterface↔Stub.Proxy, interface_cast↔asInterface. 같은 Driver 객체의 두 언어 표면이다."}];
const K=['①','②','③','④'];
const SEC={mc:'객관식',sa:'단답형',fb:'빈칸 채우기',ord:'순번 지정',match:'선잇기'};
const norm=s=>(s||'').toLowerCase().replace(/\s+/g,'');
const root=document.getElementById('qs');
let lastT=null;
QS.forEach((q,i)=>{
  const n=i+1;
  if(q.t!==lastT){const h=document.createElement('h2');h.textContent=SEC[q.t];root.appendChild(h);lastT=q.t;}
  const d=document.createElement('div');d.className='q '+q.t;d.id='q'+n;
  let body='';
  if(q.t==='mc') body=q.opts.map((o,j)=>'<label class="opt"><input type="radio" name="q'+n+'" value="'+j+'"><span class="k">'+K[j]+'</span><span>'+o+'</span></label>').join('');
  else if(q.t==='sa') body='<input class="txt" type="text" placeholder="답을 입력하세요">';
  else if(q.t==='fb') body=q.show.map((_,j)=>'<span class="lbl">('+(j+1)+')</span><input class="txt" type="text" data-i="'+j+'">').join('');
  else if(q.t==='ord'){const N=q.items.length;body=q.items.map((it,j)=>'<div class="row"><select data-i="'+j+'"><option value="">–</option>'+Array.from({length:N},(_,k)=>'<option value="'+(k+1)+'">'+(k+1)+'</option>').join('')+'</select><span>'+it+'</span></div>').join('');}
  else if(q.t==='match'){const order=[...q.right.keys()].sort(()=>Math.random()-.5);body=q.left.map((l,j)=>'<div class="row"><span class="l">'+l+'</span><span class="arrow">→</span><select data-i="'+j+'"><option value="">선택</option>'+order.map(k=>'<option value="'+k+'">'+q.right[k]+'</option>').join('')+'</select></div>').join('');}
  let ansTxt;
  if(q.t==='mc')ansTxt=K[q.a];else if(q.t==='sa')ansTxt=q.show;else if(q.t==='fb')ansTxt=q.show.map((s,j)=>'('+(j+1)+') '+s).join('  ');
  else if(q.t==='ord')ansTxt=q.a.map((v,j)=>[v,q.items[j]]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]).join(' → ');
  else ansTxt=q.left.map((l,j)=>l+' ↔ '+q.right[q.a[j]]).join('\n');
  d.innerHTML='<div class="t"><span>Q'+n+'.</span>'+q.q+(q.t==='fb'?'<small>빈칸에 알맞은 말을 쓰시오</small>':'')+'</div>'+body+'<div class="exp"><b>정답</b> '+ansTxt+'\n'+q.exp+'</div>';
  root.appendChild(d);
});
function check(q,d){
  if(q.t==='mc'){const s=d.querySelector('input:checked');if(!s)return null;const v=+s.value;const opts=d.querySelectorAll('.opt');opts[q.a].classList.add('correct');if(v!==q.a)opts[v].classList.add('wrong');return v===q.a;}
  if(q.t==='sa'){const i=d.querySelector('input.txt');if(!i.value.trim())return null;const ok=q.a.includes(norm(i.value));i.classList.add(ok?'ok':'ng');return ok;}
  if(q.t==='fb'){const ins=[...d.querySelectorAll('input.txt')];if(ins.every(i=>!i.value.trim()))return null;let ok=true;ins.forEach((i,j)=>{const g=q.a[j].includes(norm(i.value));i.classList.add(g?'ok':'ng');if(!g)ok=false;});return ok;}
  const sels=[...d.querySelectorAll('select')];if(sels.every(s=>!s.value))return null;let ok=true;
  sels.forEach((s,j)=>{const g=s.value!==''&&+s.value===q.a[j];s.classList.add(g?'ok':'ng');if(!g)ok=false;});return ok;
}
function clearMarks(d){d.classList.remove('ok','ng');d.querySelectorAll('.opt,.txt,select').forEach(e=>e.classList.remove('correct','wrong','ok','ng'));d.querySelector('.exp').classList.remove('show');}
function grade(showAll){
  let n=0,ans=0;
  QS.forEach((q,i)=>{const d=document.getElementById('q'+(i+1));clearMarks(d);const r=check(q,d);
    if(r!==null){ans++;if(r){n++;d.classList.add('ok');}else d.classList.add('ng');}
    if(r!==null||showAll){d.querySelector('.exp').classList.add('show');if(q.t==='mc')d.querySelectorAll('.opt')[q.a].classList.add('correct');}
  });
  const s=document.getElementById('score');
  if(showAll&&ans===0){s.textContent='정답·해설 표시';s.className='';return;}
  s.textContent=n+' / '+QS.length+' 정답'+(ans<QS.length?' (미응답 '+(QS.length-ans)+')':'');s.className=n>=16?'good':'bad';
}
document.getElementById('btnGrade').onclick=()=>grade(false);
document.getElementById('btnKey').onclick=()=>grade(true);
document.getElementById('btnReset').onclick=()=>{QS.forEach((q,i)=>{const d=document.getElementById('q'+(i+1));clearMarks(d);d.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);d.querySelectorAll('input.txt').forEach(x=>x.value='');d.querySelectorAll('select').forEach(x=>x.value='');});document.getElementById('score').textContent='';window.scrollTo(0,0);};
document.getElementById('btnPrint').onclick=()=>{document.body.classList.remove('printkey');window.print();};
document.getElementById('btnPrintKey').onclick=()=>{grade(true);document.body.classList.add('printkey');window.print();document.body.classList.remove('printkey');};
</script></body></html>
