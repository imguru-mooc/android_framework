<html lang="ko">
<head>

<title>Android Framework 16 심화 — Day 3 애니메이션</title>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--line:#22304a;--ink:#dbe4f0;--muted:#8a9bb5;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#34d399;--red:#f87171;--violet:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
header{display:flex;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.05rem;color:var(--amber);font-weight:600}
header span{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;padding:12px 24px 0;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-size:.9rem}
.tab.on{color:var(--amber);border-bottom-color:var(--panel);background:#15203a}
main{padding:0 24px 24px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:16px;min-height:520px}
.scene{display:none}.scene.on{display:block}
svg{width:100%;height:auto;display:block}
.svgtext{font-family:inherit;font-size:14px;fill:var(--ink)}
.mono{font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;font-size:12px;fill:var(--muted)}
.box{fill:#0f1728;stroke:var(--line);stroke-width:1.5;rx:8}
.hid{opacity:0;transition:opacity .45s}
.vis{opacity:1}
.glow{transition:stroke .3s,fill .3s}
.pkt{transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .3s}
.controls{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
button{background:#15203a;border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:.88rem}
button:hover{border-color:var(--teal)}
button.primary{background:var(--teal);color:#062a26;border-color:var(--teal);font-weight:600}
.step{color:var(--muted);font-size:.85rem;margin-left:auto}
.caption{margin-top:12px;padding:12px 16px;background:#0f1728;border-left:3px solid var(--amber);border-radius:0 6px 6px 0;min-height:56px;font-size:.95rem}
.caption b{color:var(--amber)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.78rem;color:var(--muted)}
.pill.teal{color:var(--teal);border-color:var(--teal)}.pill.amber{color:var(--amber);border-color:var(--amber)}.pill.blue{color:var(--blue);border-color:var(--blue)}.pill.green{color:var(--green);border-color:var(--green)}.pill.red{color:var(--red);border-color:var(--red)}
.bar{transition:width .6s linear}
@media (prefers-reduced-motion:reduce){.hid,.pkt,.bar,.glow{transition:none}}
</style>
</head>
<body>
<header><h1>Android Framework 16 심화 · Day 3 애니메이션</h1><span>sp/RefBase · wp · Thread · Looper · Binder Thread vs Looper · JNI · SurfaceFlinger · 공유 메모리</span></header>
<div class="tabs" id="tabs"></div>
<svg width="0" height="0" style="position:absolute"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a9bb5"/></marker></defs></svg>
<main>
<div class="stage">



<!-- ===== Scene 1: sp / RefBase ===== -->
<div class="scene" id="s1">
<svg viewBox="0 0 960 480">
  <rect x="20" y="30" width="420" height="300" rx="10" fill="#0f1728" stroke="#2dd4bf" stroke-width="1.5"/>
  <text class="svgtext" x="230" y="55" text-anchor="middle" fill="#2dd4bf">스택 — sp 변수</text>
  <g id="r_p" class="hid"><rect class="box glow" id="r_pb" x="40" y="80" width="180" height="60"/><text class="svgtext" x="130" y="104" text-anchor="middle">sp&lt;AAA&gt; p</text><text class="mono" x="130" y="124" text-anchor="middle">mPtr → AAA</text></g>
  <g id="r_q" class="hid"><rect class="box glow" id="r_qb" x="240" y="80" width="180" height="60"/><text class="svgtext" x="330" y="104" text-anchor="middle">sp&lt;AAA&gt; q = p</text><text class="mono" x="330" y="124" text-anchor="middle">mPtr → AAA (같은 객체)</text></g>
  <g id="r_code" class="hid"><rect class="box" x="40" y="160" width="380" height="150"/><text class="svgtext" x="52" y="183" fill="#f5b942">template&lt;T&gt; class sp</text>
    <text class="mono" x="52" y="206" fill="#dbe4f0">sp(T* ptr)       : mPtr(ptr)   { mPtr-&gt;incStrong(); }</text>
    <text class="mono" x="52" y="226" fill="#dbe4f0">sp(const sp&amp; r) : mPtr(r.mPtr){ mPtr-&gt;incStrong(); }</text>
    <text class="mono" x="52" y="246" fill="#dbe4f0">~sp()            { mPtr-&gt;decStrong(); }</text>
    <text class="mono" x="52" y="274" fill="#8a9bb5">카운트는 sp 가 아니라 객체(RefBase) 안에 있다</text>
    <text class="mono" x="52" y="294" fill="#8a9bb5">→ intrusive. shared_ptr 은 control block 에 (non-intrusive)</text></g>
  <rect x="480" y="30" width="460" height="300" rx="10" fill="#0f1728" stroke="#f5b942" stroke-width="1.5"/>
  <text class="svgtext" x="710" y="55" text-anchor="middle" fill="#f5b942">힙 — AAA : RefBase</text>
  <g id="r_obj" class="hid"><rect class="box glow" id="r_objb" x="500" y="80" width="420" height="110"/><text class="svgtext" x="512" y="103" fill="#dbe4f0">AAA 객체  (new AAA())</text>
    <text class="mono" x="512" y="128" fill="#8a9bb5">RefBase 부분:</text>
    <text class="mono" x="640" y="128" fill="#f5b942" id="r_cnt">mStrong = 0</text>
    <text class="mono" x="512" y="150" fill="#dbe4f0">incStrong() { mStrong++; }</text>
    <text class="mono" x="512" y="170" fill="#dbe4f0">decStrong() { if (--mStrong == 0) delete this; }</text></g>
  <g id="r_bar" class="hid"><text class="mono" x="500" y="222">mStrong</text><rect x="570" y="208" width="350" height="20" rx="4" fill="#0b1220" stroke="#22304a"/><rect id="r_barfill" class="bar" x="570" y="208" width="0" height="20" rx="4" fill="#f5b942"/><text id="r_barlbl" class="mono" x="580" y="223" fill="#0b1220"></text></g>
  <g id="r_del" class="hid"><rect x="500" y="245" width="420" height="70" rx="8" fill="#3b1220" stroke="#f87171"/><text class="svgtext" x="710" y="270" text-anchor="middle" fill="#f87171">mStrong == 0 → delete this</text><text class="mono" x="710" y="292" text-anchor="middle">AAA::~AAA() → RefBase::~RefBase()  (virtual 소멸자)</text></g>
  <g id="r_note" class="hid"><rect class="box" x="20" y="350" width="920" height="110"/><text class="svgtext" x="32" y="375" fill="#f5b942">실습 2 의 4단계가 도달한 곳</text>
    <text class="svgtext" x="32" y="400">① sp 소멸자에서 delete → 복사하면 double free &nbsp;&nbsp; ② static 카운트 → 객체끼리 공유되어 누수 &nbsp;&nbsp; ③ 객체 안에 카운트 → 클래스마다 반복</text>
    <text class="svgtext" x="32" y="424">④ RefBase 로 분리 — 카운트와 delete this 를 공통 부모로. Binder 객체·Surface·Thread·Looper 가 전부 이 RefBase.</text>
    <text class="svgtext" x="32" y="448" fill="#8a9bb5">new 직후 바로 sp 에 담고, delete 는 절대 직접 쓰지 않는다. 마지막 sp 가 사라질 때 객체가 스스로 사라진다.</text></g>
</svg>
</div>

<!-- ===== Scene 2: wp / promote / 순환 ===== -->
<div class="scene" id="s2">
<svg viewBox="0 0 960 480">
  <text class="svgtext" x="20" y="35" fill="#f5b942">wp 와 promote()</text>
  <g id="w_owner" class="hid"><rect class="box glow" id="w_ownerb" x="20" y="50" width="170" height="54"/><text class="svgtext" x="105" y="72" text-anchor="middle">sp&lt;AAA&gt; owner</text><text class="mono" x="105" y="92" text-anchor="middle">강한 참조 1</text></g>
  <g id="w_wp" class="hid"><rect class="box glow" id="w_wpb" x="210" y="50" width="170" height="54"/><text class="svgtext" x="295" y="72" text-anchor="middle">wp&lt;AAA&gt; p = owner</text><text class="mono" x="295" y="92" text-anchor="middle">강한 카운트 무관</text></g>
  <g id="w_obj" class="hid"><rect class="box glow" id="w_objb" x="20" y="120" width="360" height="60"/><text class="svgtext" x="200" y="143" text-anchor="middle">AAA 객체</text><text class="mono" x="200" y="165" text-anchor="middle" id="w_objcnt">mStrong = 1   mWeak = 2</text></g>
  <g id="w_pr1" class="hid"><rect x="20" y="195" width="360" height="44" rx="8" fill="#0f2a22" stroke="#34d399"/><text class="mono" x="200" y="222" text-anchor="middle" fill="#34d399">sp&lt;AAA&gt; q = p.promote()  → 성공 (mStrong 2)</text></g>
  <g id="w_clear" class="hid"><rect x="20" y="250" width="360" height="44" rx="8" fill="#2a2510" stroke="#f5b942"/><text class="mono" x="200" y="277" text-anchor="middle" fill="#f5b942">owner.clear()  → mStrong 0 → 객체 소멸</text></g>
  <g id="w_pr2" class="hid"><rect x="20" y="305" width="360" height="44" rx="8" fill="#3b1220" stroke="#f87171"/><text class="mono" x="200" y="332" text-anchor="middle" fill="#f87171">p.promote()  → nullptr  (반드시 검사)</text></g>
  <text class="svgtext" x="440" y="35" fill="#f5b942">순환 참조</text>
  <g id="w_cyc" class="hid"><rect class="box glow" id="w_ab" x="440" y="60" width="200" height="70"/><text class="svgtext" x="540" y="85" text-anchor="middle">AAA</text><text class="mono" x="540" y="108" text-anchor="middle" id="w_a_field">sp&lt;BBB&gt; pb</text>
    <rect class="box glow" id="w_bb" x="740" y="60" width="200" height="70"/><text class="svgtext" x="840" y="85" text-anchor="middle">BBB</text><text class="mono" x="840" y="108" text-anchor="middle" id="w_b_field">sp&lt;AAA&gt; pa</text>
    <line x1="640" y1="80" x2="735" y2="80" stroke="#f87171" stroke-width="2" marker-end="url(#arr)"/><line x1="740" y1="110" x2="645" y2="110" stroke="#f87171" stroke-width="2" marker-end="url(#arr)" id="w_backarrow"/></g>
  <g id="w_leak" class="hid"><rect x="440" y="150" width="500" height="80" rx="8" fill="#3b1220" stroke="#f87171"/><text class="svgtext" x="690" y="175" text-anchor="middle" fill="#f87171">main 의 p, q 가 사라져도 mStrong 이 1 로 남는다</text><text class="mono" x="690" y="198" text-anchor="middle">A 는 B 가, B 는 A 가 잡고 있다 → 소멸자 안 불림 = 누수</text><text class="mono" x="690" y="218" text-anchor="middle" fill="#8a9bb5">실습 3 ④: "after" 만 찍힌다</text></g>
  <g id="w_fix" class="hid"><rect x="440" y="250" width="500" height="100" rx="8" fill="#0f2a22" stroke="#34d399"/><text class="svgtext" x="690" y="275" text-anchor="middle" fill="#34d399">한쪽을 wp 로 — BBB { wp&lt;AAA&gt; pa; }</text><text class="mono" x="690" y="298" text-anchor="middle">B → A 참조가 강한 카운트를 안 올린다 → main 이 놓으면 A 소멸 → B 소멸</text><text class="mono" x="690" y="320" text-anchor="middle">B 가 A 를 쓸 때는 pa.promote() 후 null 검사</text><text class="mono" x="690" y="340" text-anchor="middle" fill="#8a9bb5">Listener · Callback · 부모↔자식 은 항상 이 패턴</text></g>
  <g id="w_note" class="hid"><rect class="box" x="20" y="370" width="920" height="90"/><text class="svgtext" x="32" y="395" fill="#f5b942">RefBase 의 두 카운트</text>
    <text class="svgtext" x="32" y="420">mStrong: sp 의 수 — 0 이 되면 객체 소멸 &nbsp;&nbsp;&nbsp; mWeak: sp + wp 의 수 — 0 이 되면 weakref_impl(카운트 블록) 소멸</text>
    <text class="svgtext" x="32" y="444" fill="#8a9bb5">그래서 객체가 죽은 뒤에도 wp 는 안전하게 "죽었다" 를 알 수 있다. onFirstRef() 는 mStrong 이 0→1 될 때 한 번 (실습 4 Thread::run 트리거)</text></g>
</svg>
</div>

<!-- ===== Scene 3: Thread 단계별 ===== -->
<div class="scene" id="s3">
<svg viewBox="0 0 960 480">
  <g id="t_s1" class="hid"><rect class="box glow" id="t_s1b" x="20" y="40" width="210" height="90"/><text class="svgtext" x="32" y="63" fill="#f5b942">① pthread 직접</text><text class="mono" x="32" y="86" fill="#dbe4f0">void* foo(void*)</text><text class="mono" x="32" y="104" fill="#dbe4f0">pthread_create(&amp;t,0,foo,0)</text><text class="mono" x="32" y="122" fill="#f87171">전역 함수 → 멤버 접근 불가</text></g>
  <g id="t_s2" class="hid"><line x1="230" y1="85" x2="255" y2="85" stroke="#8a9bb5" marker-end="url(#arr)"/><rect class="box glow" id="t_s2b" x="260" y="40" width="210" height="90"/><text class="svgtext" x="272" y="63" fill="#f5b942">② static 트램폴린</text><text class="mono" x="272" y="86" fill="#dbe4f0">static void* __handler(void*)</text><text class="mono" x="272" y="104" fill="#dbe4f0">  { ((Thread*)d)-&gt;handler(); }</text><text class="mono" x="272" y="122" fill="#34d399">pthread_create(…,__hdl,this)</text></g>
  <g id="t_s3" class="hid"><line x1="470" y1="85" x2="495" y2="85" stroke="#8a9bb5" marker-end="url(#arr)"/><rect class="box glow" id="t_s3b" x="500" y="40" width="210" height="90"/><text class="svgtext" x="512" y="63" text-anchor="start" fill="#f5b942">③ 순수 가상 handler</text><text class="mono" x="512" y="86" fill="#dbe4f0">virtual void handler() = 0;</text><text class="mono" x="512" y="104" fill="#dbe4f0">class MyThread : Thread</text><text class="mono" x="512" y="122" fill="#8a9bb5">골격은 부모, 내용은 자식</text></g>
  <g id="t_s4" class="hid"><line x1="710" y1="85" x2="735" y2="85" stroke="#8a9bb5" marker-end="url(#arr)"/><rect class="box glow" id="t_s4b" x="740" y="40" width="200" height="90"/><text class="svgtext" x="752" y="63" fill="#f5b942">④ android::Thread</text><text class="mono" x="752" y="86" fill="#dbe4f0">utils/Thread.h</text><text class="mono" x="752" y="104" fill="#dbe4f0">: RefBase</text><text class="mono" x="752" y="122" fill="#34d399">run · readyToRun · threadLoop</text></g>
  <!-- lifecycle timeline -->
  <text class="svgtext" x="20" y="170" fill="#f5b942">④ 생명주기 — sp&lt;Thread&gt; p = new MyThread;  p-&gt;join();</text>
  <g id="t_l1" class="hid"><rect class="box glow" id="t_l1b" x="20" y="185" width="150" height="50"/><text class="mono" x="95" y="206" text-anchor="middle" fill="#dbe4f0">new MyThread</text><text class="mono" x="95" y="224" text-anchor="middle" fill="#8a9bb5">생성자</text></g>
  <g id="t_l2" class="hid"><line x1="170" y1="210" x2="190" y2="210" stroke="#8a9bb5" marker-end="url(#arr)"/><rect class="box glow" id="t_l2b" x="195" y="185" width="150" height="50"/><text class="mono" x="270" y="206" text-anchor="middle" fill="#f5b942">onFirstRef()</text><text class="mono" x="270" y="224" text-anchor="middle" fill="#8a9bb5">sp 에 담기는 순간 → run()</text></g>
  <g id="t_l3" class="hid"><line x1="345" y1="210" x2="365" y2="210" stroke="#8a9bb5" marker-end="url(#arr)"/><rect class="box glow" id="t_l3b" x="370" y="185" width="150" height="50"/><text class="mono" x="445" y="206" text-anchor="middle" fill="#dbe4f0">run("name")</text><text class="mono" x="445" y="224" text-anchor="middle" fill="#8a9bb5">pthread + mHoldSelf</text></g>
  <g id="t_l4" class="hid"><line x1="520" y1="210" x2="540" y2="210" stroke="#8a9bb5" marker-end="url(#arr)"/><rect class="box glow" id="t_l4b" x="545" y="185" width="150" height="50"/><text class="mono" x="620" y="206" text-anchor="middle" fill="#dbe4f0">readyToRun()</text><text class="mono" x="620" y="224" text-anchor="middle" fill="#8a9bb5">1회 · 실패 시 취소</text></g>
  <g id="t_l5" class="hid"><line x1="695" y1="210" x2="715" y2="210" stroke="#8a9bb5" marker-end="url(#arr)"/><rect class="box glow" id="t_l5b" x="720" y="185" width="220" height="50"/><text class="mono" x="830" y="206" text-anchor="middle" fill="#dbe4f0">threadLoop()  true → 반복</text><text class="mono" x="830" y="224" text-anchor="middle" fill="#8a9bb5">false → 종료 → join 반환</text></g>
  <g id="t_loop" class="hid"><path d="M 900 235 Q 900 262 830 262 Q 760 262 760 240" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr)"/><text class="mono" x="830" y="280" text-anchor="middle" fill="#34d399">return true</text></g>
  <g id="t_hold" class="hid"><rect class="box" x="20" y="300" width="450" height="80"/><text class="svgtext" x="32" y="323" fill="#f5b942">Thread 가 RefBase 인 이유</text><text class="mono" x="32" y="346" fill="#dbe4f0">_threadLoop: sp&lt;Thread&gt; strong(self-&gt;mHoldSelf);</text><text class="svgtext" x="32" y="370" fill="#8a9bb5">실행 중 자기 자신을 sp 로 잡아 둔다 → main 이 sp 를 버려도 끝까지 돈다</text></g>
  <g id="t_java" class="hid"><rect class="box" x="490" y="300" width="450" height="80"/><text class="svgtext" x="502" y="323" fill="#a78bfa">같은 패턴</text><text class="svgtext" x="502" y="346">Looper 콜백 `void* data` (실습 5) · JNI · PoolThread (실습 6)</text><text class="svgtext" x="502" y="370" fill="#8a9bb5">"C 콜백에 this, static 에서 복원" — 공통 관용구</text></g>
  <g id="t_note" class="hid"><rect class="box" x="20" y="400" width="920" height="60"/><text class="svgtext" x="32" y="425" fill="#f5b942">threadLoop 반환값이 루프를 결정한다</text><text class="svgtext" x="32" y="448" fill="#8a9bb5">while(1) 을 직접 쓰지 않는다. requestExit() 는 exitPending() 을 true 로 만들 뿐 — 루프 안에서 확인해 false 를 반환해야 종료된다.</text></g>
</svg>
</div>

<!-- ===== Scene 4: Looper 두 얼굴 ===== -->
<div class="scene" id="s4">
<svg viewBox="0 0 960 480">
  <rect x="330" y="30" width="300" height="300" rx="10" fill="#0f1728" stroke="#f5b942" stroke-width="1.5"/>
  <text class="svgtext" x="480" y="55" text-anchor="middle" fill="#f5b942">Looper (main Thread)</text>
  <rect class="box glow" id="lp_epoll" x="350" y="70" width="260" height="70"/><text class="svgtext" x="480" y="94" text-anchor="middle">epoll_wait(mEpollFd, timeout)</text><text class="mono" x="480" y="114" text-anchor="middle">pollOnce() 의 실체</text><text class="mono" x="480" y="130" text-anchor="middle" id="lp_state" fill="#8a9bb5">대기 중…</text>
  <rect class="box glow" id="lp_set" x="350" y="155" width="260" height="80"/><text class="svgtext" x="480" y="178" text-anchor="middle">등록된 fd 집합</text><text class="mono" x="360" y="200" fill="#dbe4f0">mWakeEventFd (eventfd)  ← 항상</text><text class="mono" x="360" y="218" fill="#8a9bb5" id="lp_fd2">pipe fd[0] + callback + data</text>

  ]},
{ id:'s7', title:'7. SurfaceFlinger 파이프라인', pills:[['SurfaceComposerClient','teal'],['Transaction','teal'],['BufferQueue / dmabuf','amber'],['VSync → Looper','blue']],
  reset(){['sf_c1','sf_c2','sf_c3','sf_c4','sf_bq','sf_vs','sf_s1','sf_s2','sf_s3','sf_note'].forEach(i=>hide(i));['sf_c1b','sf_c2b','sf_c3b','sf_c4b','sf_s1b','sf_s2b','sf_s3b'].forEach(unlit);['sf_b0s','sf_b1s','sf_b2s'].forEach(i=>$(i).textContent='FREE');['sf_b0','sf_b1','sf_b2'].forEach(i=>{$(i).setAttribute('fill','#0f1728');$(i).setAttribute('stroke','#22304a');});},
  steps:[
   ['Client 가 <b>SurfaceComposerClient</b>(Binder) 로 SF 에 연결, <b>createSurface</b> → sp&lt;SurfaceControl&gt; = Layer 핸들.',()=>{show('sf_c1','sf_s1');lit('sf_c1b','#2dd4bf');lit('sf_s1b','#60a5fa');}],
   ['<b>Transaction</b> { setLayer, setPosition, show }.apply() — 여러 속성이 한 VSync 에 원자 적용.',()=>{show('sf_c2');lit('sf_c2b','#2dd4bf');}],
   ['<b>ANativeWindow_lock</b> = BufferQueue 에서 dequeue. 3개 버퍼(triple buffering) 중 FREE 하나를 빌린다.',()=>{show('sf_bq','sf_c3');lit('sf_c3b','#2dd4bf');$('sf_b0s').textContent='DEQUEUED';$('sf_b0').setAttribute('stroke','#2dd4bf');}],
   ['픽셀을 stride 기준으로 쓴 뒤 <b>unlockAndPost</b> = queueBuffer. 버퍼는 <b>dmabuf FD</b> 라 복사가 없다.',()=>{$('sf_b0s').textContent='QUEUED';$('sf_b0').setAttribute('stroke','#f5b942');}],
   ['다음 <b>VSync</b> 에 SF 가 acquire → <b>onMessageRefresh → composite</b> — 모든 Layer 를 z 순서로 합성.',()=>{show('sf_vs','sf_s2');lit('sf_s2b','#60a5fa');$('sf_b0s').textContent='ACQUIRED';$('sf_b0').setAttribute('stroke','#60a5fa');}],
   ['<b>HWC / Gralloc → Display</b>. 표시가 끝나면 release → 버퍼가 FREE 로 돌아온다.',()=>{show('sf_s3');lit('sf_s3b','#60a5fa');$('sf_b0s').textContent='FREE';$('sf_b0').setAttribute('stroke','#34d399');}],
   ['애니메이션(실습 10): SF 가 주는 <b>VSync fd</b> 를 <b>Looper::addFd + LooperCallback</b> 으로 받아 매 프레임 setPosition. 실습 5 ④ 그대로.',()=>{show('sf_c4');lit('sf_c4b','#a78bfa');}],
   ['Producer → BufferQueue → Consumer. 16.67 ms 를 넘기면 Jank (실습 13). Layer 수명 = sp&lt;SurfaceControl&gt; 수명.',()=>show('sf_note')],
  ]},
{ id:'s8', title:'8. 공유 메모리 — FD 가 Binder 를 타다', pills:[['BINDER_TYPE_FD · dup','amber'],['pipe (복사)','green'],['ashmem / MemoryHeapBase','teal'],['memfd + F_SEAL','blue']],
  reset(){['m_s1','m_s2','m_d1','m_kobj','m_c1','m_c2','m_note'].forEach(i=>hide(i));['m_s1b','m_s2b','m_d1b','m_c1b','m_c2b'].forEach(unlit);const p=$('pkt8');p.style.opacity=0;p.style.transform='translate(150px,175px)';$('pkt8_t').textContent='fd 7';},
  steps:[
   ['서버가 <b>pipe / ashmem / memfd</b> 중 하나를 만든다. fd 테이블의 번호 7 은 커널 file 객체를 가리키는 색인일 뿐.',()=>{show('m_s1');lit('m_s1b','#60a5fa');}],
   ['<b>writeFileDescriptor(7)</b> — Parcel 에 flat_binder_object(BINDER_TYPE_FD). 데이터가 아니라 참조가 실린다.',()=>{show('m_s2');lit('m_s2b','#60a5fa');const p=$('pkt8');p.style.opacity=1;p.style.transform='translate(150px,175px)';}],
   ['Driver 가 수신 Process 의 fd 테이블에 <b>dup</b> — 같은 file 객체, 새 번호 5. 숫자를 보내는 것이 아니다.',()=>{lit('m_d1b','#f5b942');show('m_d1');$('pkt8').style.transform='translate(480px,105px)';$('pkt8_t').textContent='dup';}],
   ['Client 의 <b>readFileDescriptor() = 5</b>. 서버의 7 과 다른 번호 (실습 11 ① 출력).',()=>{show('m_c1');lit('m_c1b','#2dd4bf');$('pkt8').style.transform='translate(800px,100px)';$('pkt8_t').textContent='fd 5';}],
   ['file 객체의 <b>종류</b>만 다르다 — pipe 링 버퍼 / ashmem 페이지 / memfd tmpfs 파일 / dmabuf. 전달 메커니즘은 하나.',()=>show('m_kobj')],
   ['<b>pipe</b>: read 로 복사해 받는다. <b>ashmem</b>: mmap 하면 서버와 같은 페이지 — MemoryHeapBase 의 interface_cast 가 FD 수신 + mmap 을 대신 한다.',()=>{show('m_c2');lit('m_c2b','#34d399');}],
   ['<b>memfd + F_SEAL_WRITE</b>: Client 의 PROT_WRITE mmap 과 ftruncate 가 EPERM — 커널이 봉인을 보장 (실습 11 ③).',()=>lit('m_c2b','#60a5fa')],
   ['선택 기준. Binder Buffer 1 MB 는 FD 하나만 쓴다. dumpsys meminfo 의 Ashmem / Other mmap / Graphics 가 이 페이지들 (실습 12).',()=>show('m_note')],
  ]},
];
let cur=0, step=-1, timer=null;
const tabs=$('tabs');
SCENES.forEach((s,i)=>{const t=document.createElement('div');t.className='tab';t.textContent=s.title;t.onclick=()=>select(i);tabs.appendChild(t);});
function select(i){stop();cur=i;document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));document.querySelectorAll('.scene').forEach((sc,k)=>sc.classList.toggle('on',k===i));
  $('pills').innerHTML=SCENES[i].pills.map(p=>`<span class="pill ${p[1]}">${p[0]}</span>`).join('');reset();}
function reset(){stop();step=-1;SCENES[cur].reset();$('caption').innerHTML='▶ 재생 또는 다음 ▶ 을 눌러 시작합니다.';$('stepTxt').textContent=`0 / ${SCENES[cur].steps.length}`;}
function next(){const st=SCENES[cur].steps;if(step>=st.length-1){stop();return;}step++;st[step][1]();$('caption').innerHTML=st[step][0];$('stepTxt').textContent=`${step+1} / ${st.length}`;}
function prev(){if(step<0)return;const target=step-1;SCENES[cur].reset();step=-1;for(let k=0;k<=target;k++)next();if(target<0)reset();}
function play(){if(timer){stop();return;}$('btnPlay').textContent='❚❚ 일시정지';if(step>=SCENES[cur].steps.length-1)reset();next();timer=setInterval(()=>{next();if(step>=SCENES[cur].steps.length-1)stop();},2600);}
function stop(){if(timer)clearInterval(timer);timer=null;$('btnPlay').textContent='▶ 재생';}
$('btnPlay').onclick=play;$('btnNext').onclick=()=>{stop();next();};$('btnPrev').onclick=()=>{stop();prev();};$('btnReset').onclick=reset;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next();}else if(e.key==='ArrowLeft'){stop();prev();}else if(e.key===' '){e.preventDefault();play();}});
(function(){var h=parseInt((location.hash||'').replace('#s',''),10);select(isNaN(h)||h<1||h>SCENES.length?0:h-1);})();
window.addEventListener('hashchange',function(){var h=parseInt((location.hash||'').replace('#s',''),10);if(!isNaN(h)&&h>=1&&h<=SCENES.length)select(h-1);});
</script>
