{t:"수집가 — SurfaceFlinger의 Layer 목록",on:["bSF"],

{t:"🔴 난입 — N-2 My Cpp Surface",show:["bA3","a3","l3","sApp","sBar","sRed"],on:["bA3"],arrows:["a3:red"],pkts:[{path:"p3",cls:"red",dur:1000,loop:true,gap:600}],

{t:"의미 — Java는 편의였을 뿐",show:["l3","sRed","sApp","sBar","tBoot"],on:["bSF"],
