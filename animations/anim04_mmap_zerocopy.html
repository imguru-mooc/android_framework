<div id="wrap">
<div class="goal">학습 목표: <b>copy_from_user() 1회</b>가 유일한 복사이며, 커널 버퍼와 서버 mmap 영역의 PTE가 <b>동일한 물리 프레임</b>을 가리켜 서버 측 복사가 0회임을 커널 함수 수준에서 이해한다.</div>

<script src="assets/player.js"></script>
<script>
initAnim({autoMs:4200,steps:[
{t:"서버가 Binder를 여는 순간 — binder_mmap()",on:["zServer","bMmap"],
 n:"system_server가 <span class='fn'>open(\"/dev/binder\")</span> 후 mmap을 호출하면 커널의 <span class='fn'>binder_mmap()</span>이 서버 주소 공간에 <b>약 1MB의 VMA</b>를 만듭니다. 이 시점엔 물리 페이지가 없는 빈 껍데기(on-demand)입니다. 권한이 <b>r--p(읽기 전용)</b>인 점을 기억하세요 — 서버는 이 창을 '읽기만' 합니다.",
 c:"$ adb shell cat /proc/$(pidof system_server)/maps | grep /dev/binder\n7f8a00000000-7f8a000ff000 <span class='y'>r--p</span> 00000000 00:06 1234  /dev/binder\n<span class='c'># 0xff000 ≈ 1,044,480 바이트 ≈ 1MB — 트랜잭션 최대 크기와 일치 (실습 4-1)</span>"},
{t:"Client가 transact() 호출",on:["zClient","bParcel","bTransact"],arrows:["aC2K"],pkts:[{path:"mpC2K",cls:"blu",dur:1400,loop:true,gap:800}],
 n:"Client는 <span class='fn'>Parcel</span>에 인자를 직렬화하고 <span class='fn'>BinderProxy.transact()</span> → JNI → <span class='fn'>IPCThreadState::talkWithDriver()</span> → <span class='fn'>ioctl(BINDER_WRITE_READ)</span>로 커널에 진입합니다. 데이터는 아직 Client 사용자 공간에 있습니다."},
{t:"커널: 버퍼 할당 + 물리 페이지 확보",on:["zKern","bIoctl","bAlloc","bFrame"],arrows:["aK2A","aA2F"],
 n:"<span class='fn'>binder_transaction()</span>이 <span class='fn'>binder_alloc_buf()</span>로 트랜잭션 크기만큼 버퍼를 할당하고, <span class='fn'>alloc_page(GFP_KERNEL)</span>로 <b>물리 페이지 프레임(PFN)</b>을 이제서야 확보합니다."},
{t:"★ 트릭의 핵심 — 두 PTE가 같은 프레임을 가리킨다",on:["bFrame","bPteK","bPteS"],arrows:["aPteK","aPteS"],
 n:"커널은 이 프레임을 <span class='fn'>kmap()</span>으로 커널 주소에 매핑하는 <b>동시에</b>, <span class='fn'>vm_insert_page()</span>로 <b>서버 VMA의 페이지 테이블에도 같은 프레임을 꽂아 넣습니다.</b> 커널 PTE와 서버 PTE → 동일 물리 프레임. 이것이 zero-copy의 전부입니다.",
 c:"<span class='c'>// drivers/android/binder_alloc.c (개념 흐름)</span>\npage = alloc_page(GFP_KERNEL);\nkmap(page);                       <span class='c'>// 커널 매핑</span>\nvm_insert_page(vma, addr, page);  <span class='c'>// ★ 서버 사용자공간에 삽입</span>"},
{t:"유일한 복사 1회 — copy_from_user()",on:["bTransact","bFrame"],show:["tData"],arrows:["aC2K","aK2A","aA2F"],pkts:[{path:"mpC2K",cls:"",dur:1100},{path:"mpK2F",cls:"",dur:600,delay:1150}],
 n:"<span class='fn'>copy_from_user()</span>가 Client의 Parcel 데이터를 방금 확보한 물리 페이지로 <b>딱 1회</b> 복사합니다. 전체 여정에서 데이터가 이동하는 것은 이 한 번뿐입니다."},
{t:"서버는 복사 없이 그냥 '보인다'",on:["bFrame","bMmap","bOnT"],show:["tData"],arrows:["aF2M:grn","aM2O:grn"],pkts:[{path:"mpMmapRead",cls:"grn",dur:1300,loop:true,gap:900}],
 n:"서버의 <span class='fn'>onTransact()</span>가 받는 Parcel의 데이터 포인터는 <b>mmap 영역의 가상 주소</b> — 4단계에서 꽂은 그 물리 프레임입니다. <span class='fn'>copy_to_user()</span>는 호출되지 않습니다. <b>서버 측 복사 0회.</b>"},
{t:"Socket과의 비교 — 왜 Binder인가",show:["gSock","tData"],on:["bFrame"],
 n:"Socket은 커널 소켓 버퍼로 들어갈 때 1회, 서버로 나갈 때 <span class='fn'>copy_to_user()</span> 1회 — <b>총 2회</b>. Binder는 페이지 테이블 트릭으로 <b>1회</b>. 이 차이가 초당 수만 건의 시스템 IPC에서 성능 격차를 만듭니다."},
{t:"실습 4-1로 직접 확인",on:["bMmap","bFrame"],show:["tData"],
 n:"이제 여러분의 <b>로컬 Automotive Emulator</b>에서 이 구조를 눈으로 확인합니다. mmap 시작 주소·크기·권한을 기록표에 채우세요. <span class='path'>/sys/kernel/debug/binder/state</span>에서 할당 버퍼 수까지 — 애니메이션의 모든 요소가 실제로 존재합니다.",
 c:"$ adb root\n$ adb shell cat /proc/$(pidof system_server)/maps | grep binder\n$ adb shell cat /sys/kernel/debug/binder/state | head -30\n<span class='c'># 기록: 시작주소 / 크기 / 권한(r--p) / allocated buffers</span>"}
]});
</script></body></html>
