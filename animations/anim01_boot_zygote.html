<header><a href="index.html">◀ 목록</a><h1>① Android Boot & Zygote fork(COW) — 모든 프로세스의 족보</h1><span class="tag">Day 1 · Ch 0</span></header>

<script src="assets/player.js"></script>
<script>
initAnim({autoMs:4200,steps:[
{t:"Kernel → init (PID 1)",on:["bKern","bInit"],arrows:["a1"],
 n:"커널 부팅이 끝나면 최초의 사용자 프로세스 <b>init(PID 1)</b>이 태어나 <span class='path'>init.rc</span>를 파싱하고 servicemanager·vold 같은 네이티브 데몬을 띄웁니다.",
 c:"$ adb shell ps -A | head -3\nUSER  PID PPID ... NAME\nroot    1    0 ... <span class='y'>init</span>\nroot  512    1 ... zygote64"},
{t:"Zygote 기동 — JVM을 품고 미리 로딩",on:["bZyg"],arrows:["a2:flow"],pkts:[{path:"m2",dur:1000,loop:true,gap:700}],
 n:"init이 <span class='fn'>app_process</span>(=Zygote)를 실행합니다. Zygote는 <span class='fn'>JNI_CreateJavaVM</span>(⑰ Fourth!)으로 ART를 만들고, <span class='fn'>preloadClasses()</span>로 수천 개 Framework 클래스와 리소스를 <b>미리</b> 메모리에 올린 채 Socket을 열고 대기합니다."},
{t:"첫 자식 — system_server",on:["bZyg","bSS"],arrows:["a3:flow"],pkts:[{path:"m3",dur:1100,loop:true,gap:700}],
 n:"Zygote의 첫 fork는 <b>system_server</b> — AMS·WMS·PMS 등 80여 개 서비스의 집(⑤에서 상세). 이후 모든 앱도 같은 방식으로 fork되므로, <b>모든 앱의 PPID는 Zygote</b>입니다.",
 c:"$ adb shell ps -A | grep -E \"zygote|system_server\"\nroot   512    1 ... zygote64\nsystem 1029 <span class='y'>512</span> ... system_server   <span class='c'># PPID=512(Zygote)</span>"},
{t:"앱 fork — 0.01초의 비밀",on:["bZyg","bApp1"],arrows:["a4:flow"],pkts:[{path:"m4",dur:1000,loop:true,gap:700}],
 n:"앱 실행 요청(⑥ 4단계)이 오면 Zygote가 <span class='fn'>fork()</span> — 새 프로세스는 preload된 모든 것을 <b>복사 없이</b> 물려받습니다. 어떻게? ↓ COW 클로즈업."},
{t:"🔍 COW — 같은 물리 페이지를 함께 가리킨다",show:["gCow"],on:["cowZ","cowA","cowF"],arrows:["cA1","cA2"],
 n:"fork 직후 Zygote와 앱의 페이지 테이블은 <b>같은 물리 페이지(PFN 0x1000)</b>를 가리키고, 커널은 양쪽 모두 <b>읽기 전용(RO)</b>으로 표시합니다. 복사 0바이트 — 그래서 fork가 순식간입니다. (④ Binder mmap과 같은 '페이지 테이블 마법'의 형제)"},
{t:"🔍 쓰기 순간 — Page Fault가 복사를 일으킨다",show:["gCow","cowF2","cA3"],on:["cowA","cowF2"],arrows:["cA2","cA3:red"],
 n:"앱이 그 페이지에 <b>쓰기</b>를 시도하면 RO 위반으로 <b>Page Fault</b> 발생 → 커널이 <b>그 페이지 하나만</b> 0x2000으로 복사하고 앱의 PTE를 바꿔줍니다. 안 건드린 수천 페이지는 영원히 공유 — 메모리 절약 + 속도의 원천. (퀴즈: '언제 복사되는가?' = 쓰기 순간)"},
{t:"관찰 실습",on:["bZyg","bSS","bApp1"],
 n:"에뮬레이터에서 족보를 직접 확인하세요. Zygote가 죽으면 어떻게 될까요? — 모든 앱의 부모가 사라지므로 시스템 재시작 수준의 사건이 됩니다.",
 c:"$ adb shell ps -A -o USER,PID,PPID,NAME | grep -E \"zygote|system_server|hvac\"\n$ adb shell cat /proc/$(pidof com.example.hvacsimulator)/smaps_rollup | grep -i pss\n<span class='c'># Pss가 실제 '내 몫' 메모리 — 공유 페이지는 나눠 계산됨</span>"}
]});
</script></body></html>
