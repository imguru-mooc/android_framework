<script src="assets/player.js"></script>
<script>
initAnim({autoMs:4200,steps:[
{t:"보험 가입 — linkToDeath",on:["bA","bK"],
 n:"앱 A는 서비스 IBinder에 <span class='fn'>linkToDeath(DeathRecipient)</span>를 걸어 커널의 <b>사망 통지 명단</b>에 이름을 올립니다. 앱 B는 아무것도 하지 않습니다. [svc:ok]"},
{t:"💀 사망 — 프로세스가 사라지는 순간",on:["bSvc"],arrows:["aDie:red"],dead:true,
 n:"CarService가 크래시(S2: NPE)로 사라집니다. 커널은 그 프로세스가 가진 <b>모든 Binder 노드의 소멸을 즉시 인지</b>합니다 — 참조 장부(②)를 커널이 들고 있기에 가능한 일. [svc:dead]"},
{t:"🛡 통지 — binderDied 즉시 호출",show:["aD1"],on:["bA","bK"],arrows:["aD1:red"],pkts:[{path:"mD1",cls:"red",dur:1000,loop:true,gap:700}],
 n:"명단에 있던 앱 A에게 커널이 <b>즉시</b> 통지 → <span class='fn'>binderDied()</span> 콜백(별도 스레드!). A는 그 자리에서 UI를 안전 상태로 바꾸고 <b>재바인딩을 예약</b>합니다 — 사용자는 잠깐의 '재연결 중…'만 봅니다. [svc:dead][a:died]"},
{t:"😴 무방비 — 다음 호출의 기습",show:["aD1","aD2"],on:["bB"],arrows:["aD2:red"],
 n:"앱 B는 아무 통지도 못 받습니다. 한참 뒤 <span class='fn'>setProperty()</span>를 부르는 순간 — <b>DeadObjectException</b>. 죽은 Proxy는 되살아나지 않으므로 <b>새 IBinder를 다시 받아야</b> 합니다(재바인딩). 예외를 잡고 재시도만 반복하면 영원히 실패합니다. [svc:dead][b:exc]",
 c:"E App: android.os.<span class='r'>DeadObjectException</span>\n   at android.os.BinderProxy.transactNative(Native Method)\n<span class='c'># 이 예외 = '상대 프로세스가 죽었(었)다'는 커널의 전언</span>"},
{t:"패턴 정리 — S2의 모범 답안",show:["tHint"],on:["bA"],
 n:"<b>수신자 관점</b>: linkToDeath + binderDied에서 재바인딩. <b>제공자 관점</b>: 콜백 목록은 RemoteCallbackList(③)로 — 죽은 앱 콜백을 자동 정리. CarService가 재기동(㉔)되면 A는 매끄럽게 복귀, B는 크래시 리포트 — 워크숍 S2에서 두 앱의 운명을 비교합니다. [svc:ok][a:ok2]"}
]});
const tS=document.getElementById('tSvc'),tA=document.getElementById('tA'),tB=document.getElementById('tB');
new MutationObserver(()=>{const n=document.getElementById('narr').textContent;
 if(n.includes('[svc:ok]')){tS.textContent='CarService';tS.style.fill='#dbe4f3'}
 if(n.includes('[svc:dead]')){tS.textContent='CarService 💀';tS.style.fill='#ff7b72'}
 if(n.includes('[a:died]'))tA.textContent='상태: binderDied 수신 → 재바인딩 예약';
 if(n.includes('[a:ok2]'))tA.textContent='상태: 재연결 완료 — 무사';
 if(n.includes('[b:exc]'))tB.textContent='상태: DeadObjectException 💥';
const _el=document.getElementById('narr');if(/\[[a-z가-힣]+:[^\]]*\]/.test(_el.innerHTML))_el.innerHTML=_el.innerHTML.replace(/\s*\[[a-z가-힣]+:[^\]]*\]/g,'');}).observe(document.getElementById('narr'),{childList:true});
</script></body></html>
