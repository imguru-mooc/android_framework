<script>
initAnim({autoMs:4200,steps:[
{t:"버튼 터치 — 앱 개발자가 보는 전부",on:["zApp","bBtn","bCPM"],arrows:["a1"],
 n:"온도 ▲를 누르면 앱은 <span class='fn'>CarPropertyManager.setProperty(Float.class, HVAC_TEMPERATURE_SET, VehicleAreaSeat.ROW_1_LEFT, 23f)</span> 한 줄을 부릅니다. Property는 <b>ID + AreaId + 값</b> 3요소 — HVAC는 좌석별(area) 제어라 areaId가 필수입니다."},
{t:"🔴 Binder — car_service로",on:["bCPM","bCPS"],arrows:["a2:red"],pkts:[{path:"m2",cls:"red",dur:1200,loop:true,gap:700}],
 n:"CarPropertyManager는 Day 1에 만든 Manager와 동일한 구조 — 내부의 <span class='fn'>ICarProperty</span> Proxy가 Binder로 <b>com.android.car 프로세스</b>의 <span class='fn'>CarPropertyService</span>를 호출합니다. CarService는 system_server가 아니라 <b>별도 프로세스</b>임에 주의(❗트러블슈팅 시 pidof com.android.car).",
 c:"$ adb shell service list | grep car_property\n<span class='y'>car_property</span>: [android.car.hardware.property.ICarProperty]\n$ adb shell pidof com.android.car\n2417"},
{t:"권한 검사 — 커널이 보증한 UID로",on:["bCPS","bPerm"],arrows:["a3"],
 n:"<span class='fn'>CarPropertyService</span>는 Binder가 커널에서 주입한 호출자 UID로 <span class='fn'>android.car.permission.CONTROL_CAR_CLIMATE</span>를 검사합니다. 실패 시 <b>SecurityException</b> — 워크숍 S6 시나리오의 출발점입니다. 속성마다 요구 권한이 다릅니다(속도=CAR_SPEED 읽기 권한 등)."},
{t:"PropertyHalService — Framework의 끝",on:["bPerm","bPHS"],arrows:["a4"],
 n:"검사를 통과하면 <span class='fn'>PropertyHalService</span>가 Manager의 propertyId를 HAL의 <span class='fn'>VehiclePropValue</span>로 변환합니다. 여기까지가 <span class='path'>packages/services/Car/</span> — Framework의 마지막 층입니다."},
{t:"🔴 Binder — VHAL(AIDL HAL) 호출",on:["bPHS","bIV"],arrows:["a5:red"],pkts:[{path:"m5",cls:"red",dur:1200,loop:true,gap:700}],
 n:"Android 16의 VHAL은 <b>AIDL HAL</b> — CarService와 완전히 같은 Binder로 <span class='fn'>IVehicle.setValues()</span>를 부릅니다(HIDL의 hwservicemanager 아님). 인터페이스 정의: <span class='path'>hardware/interfaces/automotive/vehicle/aidl/</span>. Day 4의 N-1(native 서비스)이 바로 이런 데몬의 뼈대입니다."},
{t:"Vendor 구현 → 🟠 CAN 버스",on:["bVeh","bCan","zEcu"],arrows:["a6","a7"],pkts:[{path:"m7",cls:"",dur:1000,loop:true,gap:600}],
 n:"OEM Vendor 구현이 VehiclePropValue를 <b>CAN 프레임</b>(또는 SOME/IP 등)으로 번역해 차량 버스로 쏩니다. 여기부터는 Android 밖 — 전장 개발자 여러분의 영역과 만나는 지점입니다."},
{t:"ECU 적용 — 그리고 진실의 원천",on:["bCan","bEcu"],arrows:["a8"],
 n:"HVAC ECU가 액추에이터를 구동하고 실제 상태를 확정합니다. <b>중요:</b> 앱이 setProperty를 불렀다고 값이 바뀐 게 아닙니다 — <b>ECU가 확정한 값이 이벤트로 돌아와야 진짜</b>입니다. 그래서 잘 만든 HVAC 앱은 set 직후 UI를 바꾸지 않고 콜백을 기다립니다."},
{t:"🟢 되돌아오는 길 ① — onPropertyEvent",on:["bEcu","bEvt","bDisp"],arrows:["a9:grn","a10:grn"],pkts:[{path:"m9",cls:"grn",dur:1000,loop:true,gap:800},{path:"m10",cls:"grn",dur:900,delay:400,loop:true,gap:900}],
 n:"ECU 상태 변화가 VHAL로 올라오면 VHAL이 <span class='fn'>IVehicleCallback.onPropertyEvent()</span>(oneway)로 CarService에 통지 → CarService가 해당 property를 구독한 리스너 목록을 찾습니다."},
{t:"🟢 되돌아오는 길 ② — 앱 콜백, 왕복 완성",on:["bDisp","bCb"],arrows:["a11:grn"],pkts:[{path:"m11",cls:"grn",dur:900,loop:true,gap:800}],
 n:"<span class='fn'>CarPropertyEventCallback.onChangeEvent(value=23.0)</span> — Day 1에서 배운 <b>oneway 콜백 패턴</b> 그대로 앱에 도착, 이제 UI를 23℃로 갱신합니다. 총 왕복: Binder 2회(전진) + oneway 2회(복귀) + CAN 왕복."},
{t:"직접 확인 — dumpsys car_service",on:["bCPS","bPHS","bDisp"],
 n:"로컬 Automotive Emulator에서 이 경로의 실체를 확인하세요. <b>워크숍 S1(속성 반영 지연)</b>은 이 왕복 중 어느 구간이 느린지 좁히는 문제입니다 — 앱? Binder? CarService 디스패치? VHAL? 에뮬레이터의 가짜 ECU?",
 c:"$ adb shell dumpsys car_service | grep -A3 HVAC_TEMPERATURE_SET\n  Property: <span class='y'>HVAC_TEMPERATURE_SET</span> (0x15600503)\n    areaId 0x1 (ROW_1_LEFT): value=23.0  <span class='c'># ← 방금의 여행 결과</span>\n$ adb shell dumpsys car_service --services CarPropertyService | head"}
]});
</script></body></html>
