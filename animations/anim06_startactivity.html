<script>

{t:"앱 프로세스 안에서의 출발",on:["zA","bSA","bPx"],arrows:["a1"],
 n:"<span class='fn'>Activity.startActivity()</span> → <span class='fn'>startActivityForResult()</span> → <span class='fn'>Instrumentation.execStartActivity()</span>. 여기까지는 전부 <b>내 프로세스 안</b>의 평범한 메서드 호출입니다. 그리고 <span class='fn'>IActivityTaskManager.Stub.Proxy</span>를 만납니다 — Day 1에서 만든 CalcService의 Proxy와 완전히 같은 구조."},
{t:"🔴 Binder IPC ① — 프로세스 경계를 넘다",on:["bPx","bATMS"],arrows:["a2:red"],pkts:[{path:"m2",cls:"red",dur:1200,loop:true,gap:700}],
 n:"<span class='fn'>Proxy.startActivity()</span>가 Parcel을 싸서 <b>system_server</b>로 넘어갑니다. 첫 번째 Binder IPC. 수신측은 <span class='path'>frameworks/base/services/core/.../ActivityTaskManagerService.java</span>."},
{t:"ActivityStarter — 정책 결정의 심장",on:["zS","bATMS","bSup"],arrows:["a3"],
 n:"<span class='fn'>ActivityStarter.execute()</span> → <span class='fn'>startActivityInner()</span>가 launchMode·Task·권한을 판정하고, <span class='fn'>startSpecificActivity()</span>가 질문합니다: <b>\"대상 앱 프로세스가 살아있나?\"</b> — 살아있으면 바로 9단계로(웜 스타트). 오늘은 <b>없다</b>고 가정합니다(콜드 스타트)."},
{t:"🟢 Zygote에게 부탁 — Binder가 아니라 Socket!",on:["bPL","bLoop"],arrows:["a4","a5:grn"],pkts:[{path:"m5",cls:"grn",dur:1100,loop:true,gap:700}],
 n:"<span class='fn'>ZygoteProcess.start()</span>는 <b>Unix Domain Socket</b>(<span class='path'>/dev/socket/zygote</span>)으로 명령을 보냅니다. 왜 Binder가 아닐까요? — fork() 시점에 Binder 스레드 상태가 복제되면 위험하기 때문에, Zygote는 의도적으로 단순한 Socket을 씁니다. (퀴즈 단골)"},
{t:"fork() — 0.01초 만에 태어나는 프로세스",on:["zZ","bLoop","bFork"],arrows:["a6"],
 n:"<span class='fn'>Zygote.forkAndSpecialize()</span>가 <span class='fn'>fork()</span> 시스템 콜을 부릅니다. <b>COW</b> 덕분에 미리 로딩된 수천 개 Framework 클래스·리소스를 복사 없이 물려받아 수십 ms 만에 프로세스가 생깁니다. (Animation ①에서 본 그 장면)"},
{t:"새 프로세스의 첫 호흡 — ActivityThread.main()",on:["zN","bFork","bMain"],arrows:["a7"],
 n:"자식 프로세스에서 <span class='fn'>ActivityThread.main()</span>이 실행됩니다. main Looper를 준비하고 — 아직 이 프로세스는 자기가 <b>무엇을 실행해야 하는지 모릅니다.</b> system_server에게 신고하러 갑니다."},
{t:"🔴 Binder IPC ② — attachApplication()",on:["bMain","bAttach"],arrows:["a8:red"],pkts:[{path:"m8",cls:"red",dur:1300,loop:true,gap:700}],
 n:"<span class='fn'>IActivityManager.Stub.Proxy.attachApplication()</span> — 새 프로세스가 system_server에 \"저 준비됐어요\"라고 Binder로 신고. AMS는 대기 중이던 ActivityRecord를 찾아 매칭합니다."},
{t:"🔴 Binder IPC ③ — 드디어 실행 명령",on:["bAttach","bLaunch"],arrows:["a9:red"],pkts:[{path:"m9",cls:"red",dur:1300,loop:true,gap:700}],
 n:"<span class='fn'>realStartActivityLocked()</span>가 <b>scheduleLaunchActivity(Transaction)</b>을 앱으로 내려보냅니다(세 번째 Binder). 앱의 <span class='fn'>handleLaunchActivity()</span>가 <span class='fn'>onCreate() → onResume()</span>을 호출 — 드디어 화면이 뜹니다."},
{t:"정리 + 관찰 실습 3-A",on:["bSA","bATMS","bFork","bLaunch"],
 n:"<b>Binder 3회(빨강) + Socket 1회(초록) + fork 1회.</b> 프로세스 생성 구간(4~6단계)이 콜드 스타트 지연의 주범입니다. 로컬 에뮬레이터에서 콜드/웜 스타트의 Displayed 시간을 직접 비교하세요 — 차량 부팅 후 앱이 늦게 뜨는 '부팅 지연 분석'이 바로 이 체인 위의 병목 찾기입니다.",
 c:"$ adb logcat -s ActivityTaskManager | grep Displayed\nActivityTaskManager: Displayed com.example.hvac/.MainActivity: <span class='y'>+847ms</span>  <span class='c'># cold</span>\nActivityTaskManager: Displayed com.example.hvac/.MainActivity: <span class='y'>+123ms</span>  <span class='c'># warm</span>"}
]});
