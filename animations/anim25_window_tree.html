<script>
initAnim({autoMs:4200,steps:[
{t:"트리의 뿌리 — RootWindowContainer",on:["n0"],
 n:"WMS는 화면의 모든 것을 <b>하나의 트리</b>로 관리합니다. 뿌리는 <span class='fn'>RootWindowContainer</span> — dumpsys window의 최상단이 여기서 시작합니다.",
 c:"$ adb shell dumpsys window windows | head -5\nWINDOW MANAGER WINDOWS (dumpsys window windows)\n  Window #0 Window{... StatusBar}..."},
{t:"DisplayContent — 디스플레이당 하나",on:["n0","n1"],
 n:"자식은 <b>DisplayContent</b>, 물리/가상 디스플레이당 1개. 스마트폰은 보통 1개지만 <b>차량은 센터·클러스터·조수석… 여러 개</b> — 그 세계는 ㉖에서. displayId=0이 기본 디스플레이입니다."},
{t:"Task → ActivityRecord — AMS와의 접점",on:["n1","n2","n3"],
 n:"<b>Task</b>는 백스택 묶음(최근 앱 목록의 단위), 그 안의 <b>ActivityRecord</b>는 ⑥에서 AMS가 만들던 바로 그 객체입니다 — AMS(생명주기)와 WMS(창)가 이 지점에서 만납니다."},
{t:"WindowState — 실제 '창' 그리고 화면 대응",show:["aM1","aM2"],on:["n4","n5"],arrows:["aM1:grn","aM2:grn"],
 n:"잎사귀 <b>WindowState</b>가 실제 창 1개 — 우측 화면과 대응해 보세요: 앱 창은 Task 아래에, <b>StatusBar는 Task 밖</b>(SystemUI 소속, 타입 다른 창)에 삽니다. z-order·포커스·애니메이션이 모두 이 노드 속성입니다."},
{t:"두 개의 장부 — window와 SurfaceFlinger",show:["tSf","aM1","aM2"],on:["n4"],
 n:"WindowState 하나가 대략 SF Layer 하나(⑨)로 이어집니다. <b>창이 안 보이면</b>: dumpsys window에서 존재·가시성·포커스 확인 → dumpsys SurfaceFlinger에서 Layer/버퍼 확인 — 관찰 4-A의 2단 점검법입니다.",
 c:"$ adb shell dumpsys window windows | grep -E \"Window #|mHasSurface|isReadyForDisplay\"\n$ adb shell dumpsys window | grep mCurrentFocus\nmCurrentFocus=Window{... com.example.hvacsimulator/...MainActivity}"}
]});
