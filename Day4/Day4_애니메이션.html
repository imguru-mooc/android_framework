<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android Framework 16 심화 — Day 4 애니메이션</title>
<style>
:root{--bg:#0b1220;--panel:#111a2b;--line:#22304a;--ink:#dbe4f0;--muted:#8a9bb5;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#34d399;--red:#f87171;--violet:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
header{display:flex;align-items:center;gap:18px;padding:14px 24px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.05rem;color:var(--amber);font-weight:600}
header span{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;padding:12px 24px 0;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-size:.9rem}
.tab.on{color:var(--amber);border-bottom-color:var(--panel);background:#15203a}
main{padding:0 24px 24px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:16px;min-height:520px}
.scene{display:none}.scene.on{display:block}
svg{width:100%;height:auto;display:block}
.svgtext{font-family:inherit;font-size:14px;fill:var(--ink)}
.mono{font-family:"Cascadia Code","JetBrains Mono",Consolas,monospace;font-size:12px;fill:var(--muted)}
.box{fill:#0f1728;stroke:var(--line);stroke-width:1.5;rx:8}
.hid{opacity:0;transition:opacity .45s}
.vis{opacity:1}
.glow{transition:stroke .3s,fill .3s}
.pkt{transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .3s}
.controls{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
button{background:#15203a;border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:.88rem}
button:hover{border-color:var(--teal)}
button.primary{background:var(--teal);color:#062a26;border-color:var(--teal);font-weight:600}
.step{color:var(--muted);font-size:.85rem;margin-left:auto}
.caption{margin-top:12px;padding:12px 16px;background:#0f1728;border-left:3px solid var(--amber);border-radius:0 6px 6px 0;min-height:56px;font-size:.95rem}
.caption b{color:var(--amber)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.78rem;color:var(--muted)}
.pill.teal{color:var(--teal);border-color:var(--teal)}.pill.amber{color:var(--amber);border-color:var(--amber)}.pill.blue{color:var(--blue);border-color:var(--blue)}.pill.green{color:var(--green);border-color:var(--green)}.pill.red{color:var(--red);border-color:var(--red)}
.bar{transition:width .6s linear}
@media (prefers-reduced-motion:reduce){.hid,.pkt,.bar,.glow{transition:none}}
</style>
</head>
<body>
<header><h1>Android Framework 16 심화 · Day 4 애니메이션</h1><span>델타 배포 · APEX · RRO 매칭 · Car SystemUI RRO · SystemUI 프레임/QS · WMS 창 → Layer · Automotive 계층 · 버튼 한 번의 flow</span></header>
<div class="tabs" id="tabs"></div>
<svg width="0" height="0" style="position:absolute"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a9bb5"/></marker></defs></svg>
<main>

  <g id="d_r3" class="hid"><rect class="box glow" id="d_r3b" x="20" y="178" width="300" height="54"/><text class="svgtext" x="32" y="200" fill="#dbe4f0">시스템 앱 코드 (SystemUI · Settings)</text><text class="mono" x="32" y="222" fill="#8a9bb5">QS 타일, 상태바 뷰</text>

  <g id="d_r4" class="hid"><rect class="box glow" id="d_r4b" x="20" y="242" width="300" height="54"/><text class="svgtext" x="32" y="264" fill="#dbe4f0">독립 배포 모듈 (바이너리 + 라이브러리)</text><text class="mono" x="32" y="286" fill="#8a9bb5">따로 버전 관리·업데이트</text>
    <rect class="box" x="340" y="242" width="600" height="54"/><text class="mono" x="352" y="264" fill="#34d399">APEX — m com.example.x → .apex push → reboot</text><text class="mono" x="352" y="286" fill="#8a9bb5">/apex/&lt;name&gt;@&lt;ver&gt; 마운트</text></g>
  <g id="d_r5" class="hid"><rect class="box glow" id="d_r5b" x="20" y="306" width="300" height="54"/><text class="svgtext" x="32" y="328" fill="#dbe4f0">Native Service 등록 · init.rc · sepolicy</text><text class="mono" x="32" y="350" fill="#8a9bb5">Day 2 실습 9</text>
    <rect class="box" x="340" y="306" width="600" height="54"/><text class="mono" x="352" y="328" fill="#f5b942">init_rc 는 push + reboot · .te 는 sepolicy 리빌드</text><text class="mono" x="352" y="350" fill="#8a9bb5">경계선 — 여기부터 이미지가 필요해진다</text></g>
  <g id="d_r6" class="hid"><rect class="box glow" id="d_r6b" x="20" y="370" width="300" height="54"/><text class="svgtext" x="32" y="392" fill="#dbe4f0">커널 · 기본 탑재 RRO · VHAL 속성 추가</text><text class="mono" x="32" y="414" fill="#8a9bb5">Day 1 실습 13 · Vehicle Property 추가</text>
    <rect class="box" x="340" y="370" width="600" height="54"/><text class="mono" x="352" y="392" fill="#f87171">m emu_img_zip → WinSCP → Emulator 재시작</text><text class="mono" x="352" y="414" fill="#8a9bb5">수십 분 · 이것만 "이미지를 다시 굽는다"</text></g>
  <g id="d_note" class="hid"><text class="svgtext" x="20" y="455" fill="#8a9bb5">"이미지 다시 구워야 하나요?" — 표에서 줄을 찾으면 답이 나온다. 실습 2(APEX)·3(RRO)·7(소스) 이 한 줄씩.</text></g>
</svg>
</div>

   ['차 없이 재현: VHAL <b>--set</b> (값의 진실을 바꿈) vs <b>cmd car_service inject-vhal-event</b> (CarService 에만). day-night-mode 로 테마 전환.',()=>show('v_tools')],
   ['Day 2 규칙이 그대로. 콜백은 Binder Thread → runOnUiThread (Day 3). 실습 10~12.',()=>{show('v_note');$('pkt7').style.opacity=0;}],
  ]},
{ id:'s8', title:'8. 온도 버튼 한 번의 flow — 4일의 지도', pills:[['Day 1 AIDL','teal'],['Day 2 Service · HAL','blue'],['Day 3 Looper · SF','green'],['Day 4 Automotive','amber']],
  reset(){['fl_1','fl_2','fl_3','fl_4','fl_5','fl_6','fl_7','fl_note'].forEach(i=>hide(i));},
  steps:[
   ['① 앱 main Thread — 클릭 → <b>binder transaction (ICarProperty::setProperty)</b>. Day 1 의 Java AIDL Proxy.',()=>show('fl_1')],
   ['② com.android.car 의 Binder Thread 에서 <b>binder reply</b> — CarPropertyService. Day 2 실습 11 의 Java System Service.',()=>show('fl_2')],
   ['③ 같은 Thread 안에서 <b>IVehicle::setValues</b> transaction → VHAL 프로세스의 binder reply. Day 2 실습 10 의 AIDL HAL.',()=>show('fl_3')],
   ['④ VHAL → CarService 로 <b>onPropertyEvent</b> — 역방향 Binder. Day 1 실습 9 · Day 2 실습 6 의 Callback.',()=>show('fl_4')],
   ['⑤ CarService → 앱의 Binder Thread 로 <b>onChangeEvent</b>. Looper 가 없는 Thread — Day 3 실습 6.',()=>show('fl_5')],
   ['⑥ runOnUiThread → Looper 큐 → main Thread 의 <b>Choreographer#doFrame</b>. Day 3 실습 5 의 Looper.',()=>show('fl_6')],
   ['⑦ RenderThread <b>DrawFrames</b> → BufferQueue → surfaceflinger <b>onMessageRefresh</b>. Day 3 실습 9·10.',()=>show('fl_7')],
   ['이 한 줄에 4일이 다 있다. 실습 13 에서 각자 캡처하고 SQL 로 binder 쌍의 시간을 뽑는다.',()=>show('fl_note')],
  ]},
];
let cur=0, step=-1, timer=null;
const tabs=$('tabs');
SCENES.forEach((s,i)=>{const t=document.createElement('div');t.className='tab';t.textContent=s.title;t.onclick=()=>select(i);tabs.appendChild(t);});
function select(i){stop();cur=i;document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on',k===i));document.querySelectorAll('.scene').forEach((sc,k)=>sc.classList.toggle('on',k===i));
  $('pills').innerHTML=SCENES[i].pills.map(p=>`<span class="pill ${p[1]}">${p[0]}</span>`).join('');reset();}
function reset(){stop();step=-1;SCENES[cur].reset();$('caption').innerHTML='▶ 재생 또는 다음 ▶ 을 눌러 시작합니다.';$('stepTxt').textContent=`0 / ${SCENES[cur].steps.length}`;}
function next(){const st=SCENES[cur].steps;if(step>=st.length-1){stop();return;}step++;st[step][1]();$('caption').innerHTML=st[step][0];$('stepTxt').textContent=`${step+1} / ${st.length}`;}
function prev(){if(step<0)return;const target=step-1;SCENES[cur].reset();step=-1;for(let k=0;k<=target;k++)next();if(target<0)reset();}
function play(){if(timer){stop();return;}$('btnPlay').textContent='❚❚ 일시정지';if(step>=SCENES[cur].steps.length-1)reset();next();timer=setInterval(()=>{next();if(step>=SCENES[cur].steps.length-1)stop();},2600);}
function stop(){if(timer)clearInterval(timer);timer=null;$('btnPlay').textContent='▶ 재생';}
$('btnPlay').onclick=play;$('btnNext').onclick=()=>{stop();next();};$('btnPrev').onclick=()=>{stop();prev();};$('btnReset').onclick=reset;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next();}else if(e.key==='ArrowLeft'){stop();prev();}else if(e.key===' '){e.preventDefault();play();}});
(function(){var h=parseInt((location.hash||'').replace('#s',''),10);select(isNaN(h)||h<1||h>SCENES.length?0:h-1);})();
window.addEventListener('hashchange',function(){var h=parseInt((location.hash||'').replace('#s',''),10);if(!isNaN(h)&&h>=1&&h<=SCENES.length)select(h-1);});
</script>
